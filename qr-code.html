<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>QR Code Generator</title>

<!-- QRCodeStyling Library -->
<script src="https://unpkg.com/qr-code-styling@1.9.2/lib/qr-code-styling.js"></script>

<style>
    * {
        box-sizing: border-box;
    }

    body {
        margin: 0;
        font-family: Arial, sans-serif;
        background: #f4f6f8;
        color: #222;
    }

    .container {
        width: 100%;
        max-width: 900px;
        margin: auto;
        padding: 20px;
    }

    .header {
        text-align: center;
        margin-bottom: 20px;
    }

    .header h1 {
        margin-bottom: 8px;
        font-size: 30px;
    }

    .header p {
        color: #666;
        margin: 0;
    }

    .card {
        background: white;
        border-radius: 18px;
        padding: 22px;
        box-shadow: 0 8px 30px rgba(0,0,0,0.08);
    }

    .grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 25px;
    }

    .field {
        margin-bottom: 18px;
    }

    label {
        display: block;
        font-weight: 600;
        margin-bottom: 8px;
    }

    input[type="text"],
    input[type="url"],
    select {
        width: 100%;
        padding: 13px 14px;
        border: 1px solid #ddd;
        border-radius: 10px;
        font-size: 16px;
        outline: none;
    }

    input:focus,
    select:focus {
        border-color: #555;
    }

    .color-row {
        display: flex;
        gap: 12px;
        align-items: center;
    }

    input[type="color"] {
        width: 55px;
        height: 45px;
        padding: 3px;
        border: 1px solid #ddd;
        border-radius: 8px;
        cursor: pointer;
    }

    .logo-upload {
        border: 2px dashed #ddd;
        border-radius: 12px;
        padding: 18px;
        text-align: center;
        cursor: pointer;
    }

    .logo-upload:hover {
        border-color: #999;
    }

    .logo-upload input {
        display: none;
    }

    .logo-preview {
        margin-top: 10px;
        max-width: 80px;
        max-height: 80px;
        border-radius: 8px;
        display: none;
    }

    .range-row {
        display: flex;
        align-items: center;
        gap: 12px;
    }

    input[type="range"] {
        width: 100%;
    }

    .size-value {
        min-width: 50px;
        font-weight: bold;
    }

    .button {
        width: 100%;
        padding: 15px;
        border: none;
        border-radius: 12px;
        background: #111;
        color: white;
        font-size: 17px;
        font-weight: bold;
        cursor: pointer;
        margin-top: 5px;
    }

    .button:hover {
        background: #333;
    }

    .preview-section {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        min-height: 400px;
    }

    #qrPreview {
        background: white;
        padding: 15px;
        border-radius: 15px;
        box-shadow: 0 5px 20px rgba(0,0,0,0.08);
    }

    .download-btn {
        margin-top: 20px;
        padding: 13px 25px;
        border: none;
        border-radius: 10px;
        background: #198754;
        color: white;
        font-size: 16px;
        font-weight: bold;
        cursor: pointer;
        display: none;
    }

    .download-btn:hover {
        background: #157347;
    }

    .hint {
        font-size: 13px;
        color: #777;
        margin-top: 6px;
    }

    @media (max-width: 700px) {

        .container {
            padding: 12px;
        }

        .grid {
            grid-template-columns: 1fr;
        }

        .header h1 {
            font-size: 25px;
        }

        .card {
            padding: 16px;
        }

        .preview-section {
            min-height: 330px;
        }
    }
</style>
</head>

<body>

<div class="container">

    <div class="header">
        <h1>QR Code Generator</h1>
        <p>Create stylish QR codes instantly</p>
    </div>

    <div class="card">

        <div class="grid">

            <!-- SETTINGS -->
            <div>

                <!-- LINK -->
                <div class="field">
                    <label>Website / Link</label>

                    <input
                        type="url"
                        id="qrText"
                        placeholder="https://example.com"
                    >

                    <div class="hint">
                        Enter the URL you want to encode.
                    </div>
                </div>


                <!-- QR STYLE -->
                <div class="field">

                    <label>QR Code Style</label>

                    <select id="dotStyle">

                        <option value="square">
                            Square
                        </option>

                        <option value="dots">
                            Dots
                        </option>

                        <option value="rounded">
                            Rounded
                        </option>

                        <option value="extra-rounded">
                            Extra Rounded
                        </option>

                        <option value="classy">
                            Classy
                        </option>

                        <option value="classy-rounded">
                            Classy Rounded
                        </option>

                    </select>

                </div>


                <!-- CORNER STYLE -->
                <div class="field">

                    <label>Corner Style</label>

                    <select id="cornerStyle">

                        <option value="square">
                            Square
                        </option>

                        <option value="dot">
                            Dot
                        </option>

                        <option value="extra-rounded">
                            Rounded
                        </option>

                    </select>

                </div>


                <!-- QR COLOR -->
                <div class="field">

                    <label>QR Code Color</label>

                    <div class="color-row">

                        <input
                            type="color"
                            id="qrColor"
                            value="#000000"
                        >

                        <input
                            type="text"
                            id="qrColorText"
                            value="#000000"
                        >

                    </div>

                </div>


                <!-- BACKGROUND -->
                <div class="field">

                    <label>Background Color</label>

                    <div class="color-row">

                        <input
                            type="color"
                            id="bgColor"
                            value="#ffffff"
                        >

                        <input
                            type="text"
                            id="bgColorText"
                            value="#ffffff"
                        >

                    </div>

                </div>


                <!-- LOGO -->
                <div class="field">

                    <label>Logo (Optional)</label>

                    <label class="logo-upload">

                        <span>
                            📁 Click to upload logo
                        </span>

                        <input
                            type="file"
                            id="logoInput"
                            accept="image/*"
                        >

                        <img
                            id="logoPreview"
                            class="logo-preview"
                        >

                    </label>

                </div>


                <!-- SIZE -->
                <div class="field">

                    <label>QR Size</label>

                    <div class="range-row">

                        <input
                            type="range"
                            id="qrSize"
                            min="200"
                            max="1000"
                            value="500"
                        >

                        <span
                            id="sizeValue"
                            class="size-value"
                        >
                            500
                        </span>

                    </div>

                </div>


                <!-- ERROR CORRECTION -->
                <div class="field">

                    <label>Error Correction</label>

                    <select id="errorCorrection">

                        <option value="L">
                            Low
                        </option>

                        <option value="M" selected>
                            Medium
                        </option>

                        <option value="Q">
                            High
                        </option>

                        <option value="H">
                            Maximum
                        </option>

                    </select>

                    <div class="hint">
                        Use High/Maximum when using a logo.
                    </div>

                </div>


                <button
                    class="button"
                    onclick="generateQR()"
                >
                    Generate QR Code
                </button>

            </div>


            <!-- PREVIEW -->
            <div class="preview-section">

                <div id="qrPreview"></div>

                <button
                    id="downloadBtn"
                    class="download-btn"
                    onclick="downloadQR()"
                >
                    ⬇ Download QR Code
                </button>

            </div>

        </div>

    </div>

</div>


<script>

let logoData = null;
let qrCode = null;


/* -----------------------------
   COLOR SYNC
----------------------------- */

const qrColor = document.getElementById("qrColor");
const qrColorText = document.getElementById("qrColorText");

qrColor.addEventListener("input", () => {
    qrColorText.value = qrColor.value;
});

qrColorText.addEventListener("input", () => {

    if (/^#[0-9A-F]{6}$/i.test(qrColorText.value)) {
        qrColor.value = qrColorText.value;
    }

});


const bgColor = document.getElementById("bgColor");
const bgColorText = document.getElementById("bgColorText");

bgColor.addEventListener("input", () => {
    bgColorText.value = bgColor.value;
});

bgColorText.addEventListener("input", () => {

    if (/^#[0-9A-F]{6}$/i.test(bgColorText.value)) {
        bgColor.value = bgColorText.value;
    }

});


/* -----------------------------
   SIZE
----------------------------- */

const qrSize = document.getElementById("qrSize");
const sizeValue = document.getElementById("sizeValue");

qrSize.addEventListener("input", () => {

    sizeValue.textContent = qrSize.value;

});


/* -----------------------------
   LOGO UPLOAD
----------------------------- */

document
.getElementById("logoInput")
.addEventListener("change", function(e) {

    const file = e.target.files[0];

    if (!file) {
        logoData = null;
        return;
    }

    const reader = new FileReader();

    reader.onload = function(event) {

        logoData = event.target.result;

        const preview =
            document.getElementById("logoPreview");

        preview.src = logoData;
        preview.style.display = "block";

    };

    reader.readAsDataURL(file);

});


/* -----------------------------
   GENERATE QR
----------------------------- */

function generateQR() {

    const text =
        document.getElementById("qrText").value.trim();

    if (!text) {

        alert("Please enter a website or link.");

        return;

    }


    const size =
        parseInt(document.getElementById("qrSize").value);


    const dotStyle =
        document.getElementById("dotStyle").value;


    const cornerStyle =
        document.getElementById("cornerStyle").value;


    const foreground =
        document.getElementById("qrColor").value;


    const background =
        document.getElementById("bgColor").value;


    const errorCorrection =
        document.getElementById("errorCorrection").value;


    /* Clear previous QR */

    document
        .getElementById("qrPreview")
        .innerHTML = "";


    /* Create QR */

    qrCode = new QRCodeStyling({

        width: size,

        height: size,

        type: "canvas",

        data: text,

        image: logoData || undefined,

        qrOptions: {

            errorCorrectionLevel:
                errorCorrection

        },

        dotsOptions: {

            color: foreground,

            type: dotStyle

        },

        cornersSquareOptions: {

            color: foreground,

            type: cornerStyle

        },

        cornersDotOptions: {

            color: foreground,

            type: cornerStyle === "dot"
                ? "dot"
                : "square"

        },

        backgroundOptions: {

            color: background

        },

        imageOptions: {

            crossOrigin: "anonymous",

            margin: 8,

            imageSize: 0.25,

            hideBackgroundDots: true

        }

    });


    qrCode.append(
        document.getElementById("qrPreview")
    );


    document
        .getElementById("downloadBtn")
        .style.display = "block";

}


/* -----------------------------
   DOWNLOAD
----------------------------- */

function downloadQR() {

    if (!qrCode) {

        alert("Please generate a QR code first.");

        return;

    }

    qrCode.download({

        name: "my-qr-code",

        extension: "png"

    });

}

</script>

</body>
</html>
