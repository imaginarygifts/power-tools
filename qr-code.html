
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>QR Code Generator</title>

<script src="https://unpkg.com/qr-code-styling@1.9.2/lib/qr-code-styling.js"></script>
<script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.min.js"></script>

<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:#f5f7fb;color:#111827;font-family:Arial,sans-serif}
.app{max-width:900px;margin:auto;padding:14px}
.header,.section,.bottom-action,.preview-card{background:#fff;border-radius:18px;padding:18px;margin-bottom:15px;box-shadow:0 4px 20px #0000000a}
.header h1{margin:0;font-size:23px}
.header p{color:#6b7280;font-size:14px}
.preview-card{position:sticky;top:5px;z-index:10;padding:12px}
.preview-title{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.live-badge{background:#dcfce7;color:#15803d;border-radius:20px;padding:6px 10px;font-size:11px;font-weight:bold}
.preview-box{height:195px;display:flex;align-items:center;justify-content:center;background:#f8fafc;border:1px solid #e5e7eb;border-radius:15px;overflow:hidden}
#qrPreview{width:175px;height:175px;display:flex;align-items:center;justify-content:center}
#qrPreview canvas,#qrPreview img,#qrPreview svg{display:block;width:100%!important;height:100%!important}
.section-title{font-size:19px;font-weight:800;margin-bottom:15px}
label{display:block;font-size:14px;font-weight:bold;margin-bottom:7px}
textarea,input[type=text],select{width:100%;padding:13px;border:1px solid #d9dee8;border-radius:12px;font-size:15px;background:white;color:#111827}
textarea{min-height:90px;resize:vertical}
textarea:focus,input:focus,select:focus{outline:1px solid #2563eb}
.style-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:9px}
.style-btn,.quality-btn{padding:15px 5px;border:1.5px solid #dce1e9;background:#fff;border-radius:13px;font-weight:bold;cursor:pointer}
.style-btn.active,.quality-btn.active{border-color:#2563eb;background:#eff6ff;color:#1d4ed8}
.two-column{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.color-row{display:flex;gap:8px;align-items:center}
.color-picker-wrap{width:58px;min-width:58px;height:50px;border:1px solid #ddd;padding:5px;border-radius:10px}
input[type=color]{width:100%;height:100%;padding:0;border:0;background:transparent}
.logo-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.logo-card{min-height:95px;padding:8px 4px;border:1.5px solid #dce1e9;border-radius:13px;background:white;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:7px;cursor:pointer;min-width:0}
.logo-card.active{border-color:#2563eb;background:#eff6ff}
.logo-icon,.logo-none{width:40px;height:40px;object-fit:contain;display:flex;align-items:center;justify-content:center}
.logo-none{font-size:29px}
.logo-name{font-size:11px;font-weight:bold;text-align:center}
.custom-upload{margin:18px 0 22px;padding:20px;border:2px dashed #ccd5e3;border-radius:14px;background:#fafcff;display:block;cursor:pointer}
.upload-title{font-weight:bold;font-size:16px}
.upload-subtitle,.helper{color:#6b7280;font-size:12px;margin-top:5px}
#customLogoInput{display:none}
.slider-row{display:flex;align-items:center;gap:12px}
.slider-wrap{flex:1}
input[type=range]{width:100%;accent-color:#2563eb}
.slider-value{padding:9px;border:1px solid #ddd;border-radius:9px;font-weight:bold}
.quality-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.generate-btn{width:100%;min-height:58px;border:0;border-radius:14px;background:#1677f2;color:white;font-size:17px;font-weight:bold;cursor:pointer}
.generate-btn:disabled{opacity:.6}
@media(max-width:420px){.app{padding:9px}.section{padding:14px}.logo-grid{gap:5px}.logo-card{min-height:84px}.logo-icon,.logo-none{width:34px;height:34px}.logo-name{font-size:10px}.two-column{grid-template-columns:1fr}}
</style>
</head>

<body>
<div class="app">

<div class="header">
<h1>QR Code Generator</h1>
<p>Create and customize your QR code with live preview.</p>
</div>

<div class="preview-card">
<div class="preview-title">
<strong>Live QR Preview</strong>
<span class="live-badge">● LIVE</span>
</div>
<div class="preview-box"><div id="qrPreview"></div></div>
</div>

<div class="section">
<div class="section-title">🔗 QR Content</div>
<label for="qrText">Link / Text</label>
<textarea id="qrText" placeholder="Enter website link, UPI link, text, phone number, etc."></textarea>
</div>

<div class="section">
<div class="section-title">🎨 QR Style</div>
<div class="style-grid">
<button class="style-btn active" data-style="square">Square</button>
<button class="style-btn" data-style="dots">Dots</button>
<button class="style-btn" data-style="heart">♥ Heart</button>
</div>
</div>

<div class="section">
<div class="section-title">◼ Corner Style</div>
<select id="cornerStyle">
<option value="square">Square</option>
<option value="dot">Dot</option>
<option value="extra-rounded">Extra Rounded</option>
</select>
</div>

<div class="section">
<div class="section-title">🎨 Colors</div>
<div class="two-column">
<div>
<label>QR Color</label>
<div class="color-row">
<div class="color-picker-wrap"><input type="color" id="qrColorPicker" value="#000000"></div>
<input type="text" id="qrColorText" value="#000000" maxlength="7">
</div>
</div>
<div>
<label>Background Color</label>
<div class="color-row">
<div class="color-picker-wrap"><input type="color" id="bgColorPicker" value="#ffffff"></div>
<input type="text" id="bgColorText" value="#ffffff" maxlength="7">
</div>
</div>
</div>
</div>

<div class="section">
<div class="section-title">🖼️ Logo</div>
<div class="logo-grid" id="logoGrid">
<button class="logo-card active" data-logo="none">
<div class="logo-none">∅</div><div class="logo-name">None</div>
</button>
</div>

<label class="custom-upload" for="customLogoInput">
<div class="upload-title">🖼️ Upload Custom Logo</div>
<div class="upload-subtitle">Choose PNG, JPG or SVG</div>
</label>
<input type="file" id="customLogoInput" accept="image/png,image/jpeg,image/webp,image/svg+xml">

<div class="section-title">🔍 Logo Size</div>
<div class="slider-row">
<div class="slider-wrap"><input type="range" id="logoSize" min="10" max="35" value="20"></div>
<div class="slider-value" id="logoSizeValue">20%</div>
</div>
<div class="helper">A smaller logo usually helps QR scanning.</div>
</div>

<div class="section">
<div class="section-title">📐 Download Quality</div>
<div class="quality-grid">
<button class="quality-btn active" data-quality="standard">Standard</button>
<button class="quality-btn" data-quality="hd">HD</button>
<button class="quality-btn" data-quality="fhd">FHD</button>
<button class="quality-btn" data-quality="qhd">QHD</button>
<button class="quality-btn" data-quality="uhd">UHD</button>
</div>
</div>

<div class="bottom-action">
<button id="generateBtn" class="generate-btn">⬇ Generate / Download QR</button>
</div>

</div>

<script>
'use strict';

const $ = id => document.getElementById(id);

let currentStyle = 'square';
let currentLogo = 'none';
let customLogo = null;
let currentQuality = 'standard';
let qr = null;
let renderVersion = 0;

const qualitySizes = {
  standard: 800,
  hd: 1280,
  fhd: 1920,
  qhd: 2560,
  uhd: 3840
};

const iconNames = {
  instagram:'instagram',
  google:'google',
  gpay:'googlepay',
  phonepe:'phonepe',
  paytm:'paytm',
  whatsapp:'whatsapp',
  facebook:'facebook',
  youtube:'youtube',
  maps:'googlemaps',
  linkedin:'linkedin',
  telegram:'telegram',
  x:'x',
  spotify:'spotify'
};

const logoLabels = {
  instagram:'Instagram',google:'Google',gpay:'GPay',
  phonepe:'PhonePe',paytm:'Paytm',whatsapp:'WhatsApp',
  facebook:'Facebook',youtube:'YouTube',maps:'Maps',
  linkedin:'LinkedIn',telegram:'Telegram',x:'X',
  spotify:'Spotify',upi:'UPI',bhimupi:'BHIM UPI'
};

const upiSVG = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 60"><rect width="100" height="60" rx="8" fill="white"/><path d="M15 12h10l-6 18h10L18 49H8l7-18H5z" fill="#e83e8c"/><text x="37" y="40" font-size="25" font-weight="bold" fill="#111">UPI</text></svg>`;

const bhimSVG = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><circle cx="50" cy="50" r="45" fill="#e85b25"/><text x="50" y="59" text-anchor="middle" font-size="30" font-weight="bold" fill="white">B</text><text x="50" y="82" text-anchor="middle" font-size="11" fill="white">BHIM UPI</text></svg>`;

function svgData(svg) {
  return 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svg);
}

const logoSources = {
  ...Object.fromEntries(
    Object.entries(iconNames).map(([key,name]) => [
      key, `https://cdn.jsdelivr.net/npm/simple-icons@v16/icons/${name}.svg`
    ])
  ),
  upi: svgData(upiSVG),
  bhimupi: svgData(bhimSVG)
};

function validHex(v) {
  return /^#[0-9a-f]{6}$/i.test(v.trim());
}
function qrColor() {
  return validHex($('qrColorText').value) ? $('qrColorText').value.trim() : '#000000';
}
function bgColor() {
  return validHex($('bgColorText').value) ? $('bgColorText').value.trim() : '#ffffff';
}
function getText() {
  return $('qrText').value.trim() || 'https://example.com';
}
function getLogo() {
  return customLogo || (currentLogo !== 'none' ? logoSources[currentLogo] : undefined);
}
function getLogoSize() {
  return Number($('logoSize').value) / 100;
}

function buildLogoGrid() {
  const grid = $('logoGrid');

  Object.entries(logoSources).forEach(([key,src]) => {
    const button = document.createElement('button');
    button.type = 'button';
    button.className = 'logo-card';
    button.dataset.logo = key;

    const img = document.createElement('img');
    img.className = 'logo-icon';
    img.src = src;
    img.alt = logoLabels[key];
    img.onerror = () => {
      img.style.display = 'none';
      const fallback = document.createElement('div');
      fallback.className = 'logo-none';
      fallback.textContent = '●';
      button.insertBefore(fallback,button.firstChild);
    };

    const label = document.createElement('div');
    label.className = 'logo-name';
    label.textContent = logoLabels[key];

    button.append(img,label);
    grid.appendChild(button);
  });
}

function qrOptions(size,text,margin) {
  const corner = $('cornerStyle').value;
  return {
    width:size,
    height:size,
    type:'canvas',
    data:text,
    margin,
    qrOptions:{errorCorrectionLevel:'H'},
    dotsOptions:{
      type:currentStyle === 'dots' ? 'dots' : 'square',
      color:qrColor()
    },
    backgroundOptions:{color:bgColor()},
    cornersSquareOptions:{type:corner,color:qrColor()},
    cornersDotOptions:{
      type:corner === 'dot' ? 'dot' : 'square',
      color:qrColor()
    },
    image:getLogo(),
    imageOptions:{
      hideBackgroundDots:true,
      imageSize:getLogoSize(),
      margin:4,
      crossOrigin:'anonymous'
    }
  };
}

/* Heart SVG renderer. Uses the QR matrix library for valid QR data. */
function makeHeartSVG(text,size) {
  if (typeof qrcode !== 'function') {
    throw new Error('QR library failed to load. Check your internet connection.');
  }

  const matrix = qrcode(0,'H');
  matrix.addData(text);
  matrix.make();

  const n = matrix.getModuleCount();
  const quiet = 4;
  const unit = size / (n + quiet * 2);
  const fg = qrColor();
  const bg = bgColor();
  const shapes = [];

  function inFinder(r,c) {
    return (r < 8 && c < 8) ||
           (r < 8 && c >= n-8) ||
           (r >= n-8 && c < 8);
  }

  function inAlignment(r,c) {
    if (n < 25) return false;

    const centers = [6,n-7];
    for (const ar of centers) {
      for (const ac of centers) {
        if ((ar===6 && ac===6) ||
            (ar===6 && ac===n-7) ||
            (ar===n-7 && ac===6)) continue;

        if (Math.abs(r-ar)<=2 && Math.abs(c-ac)<=2) return true;
      }
    }
    return false;
  }

  function structural(r,c) {
    return inFinder(r,c) || r===6 || c===6 || inAlignment(r,c);
  }

  const heartPath =
    'M 0.5 0.9 C 0.39 0.79 0.06 0.55 0.06 0.31 ' +
    'C 0.06 0.06 0.36 0.02 0.5 0.25 ' +
    'C 0.64 0.02 0.94 0.06 0.94 0.31 ' +
    'C 0.94 0.55 0.61 0.79 0.5 0.9 Z';

  for (let r=0; r<n; r++) {
    for (let c=0; c<n; c++) {
      if (!matrix.isDark(r,c)) continue;

      const x = (c+quiet)*unit;
      const y = (r+quiet)*unit;

      if (structural(r,c)) {
        shapes.push(`<rect x="${x}" y="${y}" width="${unit}" height="${unit}"/>`);
      } else {
        const pad = unit * 0.06;
        shapes.push(
          `<path d="${heartPath}" transform="translate(${x+pad} ${y+pad}) scale(${unit*0.88})"/>`
        );
      }
    }
  }

  const logo = getLogo();
  let logoMarkup = '';

  if (logo) {
    const side = size * getLogoSize() * 0.75;
    const x = (size-side)/2;
    const pad = size*0.012;
    const safeLogo = logo.replace(/&/g,'&amp;').replace(/"/g,'&quot;');

    logoMarkup =
      `<rect x="${x-pad}" y="${x-pad}" width="${side+pad*2}" height="${side+pad*2}" rx="${pad*2}" fill="${bg}"/>` +
      `<image href="${safeLogo}" xlink:href="${safeLogo}" x="${x}" y="${x}" width="${side}" height="${side}" preserveAspectRatio="xMidYMid meet"/>`;
  }

  return `<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="${size}" height="${size}" viewBox="0 0 ${size} ${size}"><rect width="${size}" height="${size}" fill="${bg}"/><g fill="${fg}">${shapes.join('')}</g>${logoMarkup}</svg>`;
}

async function svgToPng(svg,size) {
  const blob = new Blob([svg],{type:'image/svg+xml;charset=utf-8'});
  const url = URL.createObjectURL(blob);

  try {
    const img = new Image();

    await new Promise((resolve,reject) => {
      img.onload = resolve;
      img.onerror = () => reject(new Error('Could not render the QR image. Try a different logo.'));
      img.src = url;
    });

    const canvas = document.createElement('canvas');
    canvas.width = size;
    canvas.height = size;

    const ctx = canvas.getContext('2d');
    ctx.fillStyle = bgColor();
    ctx.fillRect(0,0,size,size);
    ctx.drawImage(img,0,0,size,size);

    return await new Promise((resolve,reject) => {
      canvas.toBlob(blob => blob ? resolve(blob) : reject(new Error('PNG export failed')),'image/png');
    });
  } finally {
    URL.revokeObjectURL(url);
  }
}

async function updateQR() {
  const version = ++renderVersion;
  const container = $('qrPreview');

  try {
    if (currentStyle === 'heart') {
      const svg = makeHeartSVG(getText(),800);
      if (version !== renderVersion) return;
      container.innerHTML = svg;
      return;
    }

    if (typeof QRCodeStyling !== 'function') {
      throw new Error('QR styling library failed to load.');
    }

    container.innerHTML = '';
    qr = new QRCodeStyling(qrOptions(400,getText(),12));
    qr.append(container);
  } catch (error) {
    console.error(error);
    container.innerHTML = '';
    const message = document.createElement('div');
    message.style.cssText = 'font-size:12px;color:#b91c1c;text-align:center;padding:12px';
    message.textContent = error.message;
    container.appendChild(message);
  }
}

function downloadBlob(blob,filename) {
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(url),3000);
}

async function downloadQR() {
  const text = $('qrText').value.trim();

  if (!text) {
    alert('Please enter a link or text first.');
    $('qrText').focus();
    return;
  }

  const button = $('generateBtn');
  button.disabled = true;
  button.textContent = 'Preparing QR code...';

  try {
    const size = qualitySizes[currentQuality];

    if (currentStyle === 'heart') {
      const svg = makeHeartSVG(text,size);
      const png = await svgToPng(svg,size);
      downloadBlob(png,'QR-Code-'+currentQuality.toUpperCase()+'.png');
    } else {
      if (typeof QRCodeStyling !== 'function') {
        throw new Error('QR library failed to load. Check your internet connection.');
      }

      const instance = new QRCodeStyling(qrOptions(size,text,30));
      const blob = await instance.getRawData('png');

      if (!blob) throw new Error('Could not generate PNG.');
      downloadBlob(blob,'QR-Code-'+currentQuality.toUpperCase()+'.png');
    }
  } catch (error) {
    console.error(error);
    alert('Download failed: '+error.message);
  } finally {
    button.disabled = false;
    button.textContent = '⬇ Generate / Download QR';
  }
}

document.querySelectorAll('.style-btn').forEach(button => {
  button.addEventListener('click',() => {
    document.querySelectorAll('.style-btn').forEach(b=>b.classList.remove('active'));
    button.classList.add('active');
    currentStyle = button.dataset.style;
    updateQR();
  });
});

$('qrText').addEventListener('input',updateQR);
$('cornerStyle').addEventListener('change',updateQR);

[
  ['qrColorPicker','qrColorText'],
  ['bgColorPicker','bgColorText']
].forEach(([picker,text]) => {
  $(picker).addEventListener('input',() => {
    $(text).value = $(picker).value;
    updateQR();
  });

  $(text).addEventListener('input',() => {
    if (validHex($(text).value)) {
      $(picker).value = $(text).value;
      updateQR();
    }
  });
});

$('logoGrid').addEventListener('click',event => {
  const button = event.target.closest('.logo-card');
  if (!button) return;

  document.querySelectorAll('.logo-card').forEach(b=>b.classList.remove('active'));
  button.classList.add('active');

  currentLogo = button.dataset.logo;
  customLogo = null;
  $('customLogoInput').value = '';
  updateQR();
});

$('customLogoInput').addEventListener('change',event => {
  const file = event.target.files[0];
  if (!file) return;

  if (!file.type.startsWith('image/')) {
    alert('Please select an image file.');
    return;
  }

  const reader = new FileReader();

  reader.onload = () => {
    customLogo = reader.result;
    currentLogo = 'custom';

    document.querySelectorAll('.logo-card').forEach(b=>b.classList.remove('active'));
    updateQR();
  };

  reader.onerror = () => alert('Could not read the selected image.');
  reader.readAsDataURL(file);
});

$('logoSize').addEventListener('input',event => {
  $('logoSizeValue').textContent = event.target.value+'%';
  updateQR();
});

document.querySelectorAll('.quality-btn').forEach(button => {
  button.addEventListener('click',() => {
    document.querySelectorAll('.quality-btn').forEach(b=>b.classList.remove('active'));
    button.classList.add('active');
    currentQuality = button.dataset.quality;
  });
});

$('generateBtn').addEventListener('click',downloadQR);

buildLogoGrid();
updateQR();
</script>
</body>
</html>
