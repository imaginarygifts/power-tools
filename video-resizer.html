<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
>

<title>Bulk Video Resizer</title>

<style>

* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    padding: 0;
    background: #f5f5f5;
    font-family: Arial, Helvetica, sans-serif;
    color: #111;
}

body {
    min-height: 100vh;
}

.container {
    width: 100%;
    max-width: 760px;
    margin: auto;
    padding: 25px 18px 60px;
}

h1 {
    text-align: center;
    font-size: 34px;
    margin: 10px 0 45px;
    font-weight: 700;
}

/* =========================
   BUTTONS
========================= */

button {
    border: none;
    cursor: pointer;
    font-family: inherit;
    -webkit-tap-highlight-color: transparent;
}

.main-btn {
    width: 100%;
    height: 80px;
    border-radius: 16px;
    background: #2196f3;
    color: white;
    font-size: 28px;
    margin-bottom: 18px;
}

.main-btn:active {
    transform: scale(.99);
}

.main-btn:disabled {
    opacity: .55;
    cursor: not-allowed;
}

.generate-btn {
    background: #4caf50;
}

.zip-btn {
    background: #4caf50;
}

/* =========================
   SELECT / INPUT
========================= */

select,
input[type="text"] {
    width: 100%;
    height: 86px;

    border: 1px solid #888;
    border-radius: 0;

    background: white;

    padding: 0 28px;

    font-size: 28px;

    color: #111;

    margin-bottom: 18px;

    outline: none;
}

select:focus,
input[type="text"]:focus {
    border-color: #2196f3;
}

input::placeholder {
    color: #777;
}

.hidden-input {
    display: none;
}

/* =========================
   SELECTION BOX
========================= */

.selection-box {
    display: none;

    background: white;

    border: 1px solid #ddd;

    border-radius: 10px;

    padding: 18px;

    margin-bottom: 18px;
}

.selection-title {
    font-size: 20px;
    font-weight: bold;

    margin-bottom: 8px;
}

.selection-info {
    font-size: 17px;
    color: #555;

    line-height: 1.5;

    word-break: break-word;
}

/* =========================
   PROGRESS
========================= */

.progress-area {
    display: none;

    background: white;

    border: 1px solid #ddd;

    border-radius: 10px;

    padding: 20px;

    margin-top: 25px;
}

.progress-title {
    font-size: 20px;
    font-weight: bold;

    margin-bottom: 15px;
}

.progress-bar-bg {
    width: 100%;

    height: 22px;

    background: #ddd;

    border-radius: 20px;

    overflow: hidden;
}

.progress-bar {
    width: 0%;

    height: 100%;

    background: #4caf50;

    transition: width .15s linear;
}

.progress-text {
    text-align: center;

    font-size: 17px;

    color: #555;

    margin-top: 10px;
}

/* =========================
   STATUS
========================= */

.status {
    text-align: center;

    font-size: 18px;

    margin-top: 20px;

    min-height: 26px;

    line-height: 1.4;
}

.status.success {
    color: #2e7d32;
}

.status.error {
    color: #c62828;
}

/* =========================
   RESULTS
========================= */

.results {
    display: grid;

    grid-template-columns:
        repeat(3, minmax(0, 1fr));

    gap: 18px;

    margin-top: 38px;
}

.video-card {
    min-width: 0;
}

.video-preview {
    width: 100%;

    aspect-ratio: 1 / 1;

    object-fit: cover;

    display: block;

    background: #ddd;

    border-radius: 10px;
}

.video-name {
    margin-top: 8px;

    font-size: 14px;

    white-space: nowrap;

    overflow: hidden;

    text-overflow: ellipsis;

    color: #333;
}

.video-info {
    margin-top: 4px;

    font-size: 13px;

    color: #777;
}

.download-btn {
    width: 100%;

    height: 48px;

    margin-top: 12px;

    background: #4caf50;

    color: white;

    border-radius: 8px;

    font-size: 18px;
}

.download-btn:active {
    transform: scale(.98);
}

/* =========================
   LOADING
========================= */

.loading-spinner {
    display: inline-block;

    width: 19px;
    height: 19px;

    border: 3px solid rgba(255,255,255,.45);

    border-top-color: white;

    border-radius: 50%;

    animation: spin .8s linear infinite;

    vertical-align: middle;

    margin-right: 8px;
}

@keyframes spin {

    to {
        transform: rotate(360deg);
    }

}

/* =========================
   MOBILE
========================= */

@media(max-width:600px) {

    .container {
        padding-left: 18px;
        padding-right: 18px;
    }

    h1 {
        font-size: 34px;
    }

    .main-btn {
        font-size: 28px;
    }

    select,
    input[type="text"] {
        font-size: 28px;
    }

    .results {
        grid-template-columns:
            repeat(3, minmax(0, 1fr));
    }

}

@media(max-width:380px) {

    .results {
        grid-template-columns:
            repeat(2, minmax(0, 1fr));
    }

}

</style>
</head>


<body>

    <h1>Bulk Video Resizer</h1>


    <!-- SELECT VIDEOS -->

    <button

    <input

    <!-- FPS -->

    <!-- PREFIX -->

    <!-- GENERATE -->

        Resize Videos

    <!-- PROGRESS -->

    <div

        <div class="progress-bar-bg">

<script type="module">

/*
===========================================================
 FFmpeg
===========================================================
*/

import {
    FFmpeg
} from "https://cdn.jsdelivr.net/npm/@ffmpeg/ffmpeg@0.12.10/dist/esm/index.js";

import {
    fetchFile,
    toBlobURL
} from "https://cdn.jsdelivr.net/npm/@ffmpeg/util@0.12.1/dist/esm/index.js";


/*
===========================================================
 ELEMENTS
===========================================================
*/

const selectVideosBtn =
    document.getElementById(
        "selectVideosBtn"
    );

const selectFolderBtn =
    document.getElementById(
        "selectFolderBtn"
    );

const videoInput =
    document.getElementById(
        "videoInput"
    );

const folderInput =
    document.getElementById(
        "folderInput"
    );

const resolutionSelect =
    document.getElementById(
        "resolutionSelect"
    );

const bitrateSelect =
    document.getElementById(
        "bitrateSelect"
    );

const fpsSelect =
    document.getElementById(
        "fpsSelect"
    );

const prefixInput =
    document.getElementById(
        "prefixInput"
    );

const generateBtn =
    document.getElementById(
        "generateBtn"
    );

const zipBtn =
    document.getElementById(
        "zipBtn"
    );

const selectionBox =
    document.getElementById(
        "selectionBox"
    );

const selectionInfo =
    document.getElementById(
        "selectionInfo"
    );

const progressArea =
    document.getElementById(
        "progressArea"
    );

const progressTitle =
    document.getElementById(
        "progressTitle"
    );

const progressBar =
    document.getElementById(
        "progressBar"
    );

const progressText =
    document.getElementById(
        "progressText"
    );

const status =
    document.getElementById(
        "status"
    );

const results =
    document.getElementById(
        "results"
    );


/*
===========================================================
 VARIABLES
===========================================================
*/

let selectedVideos = [];

let convertedVideos = [];

let ffmpeg = null;

let ffmpegLoaded = false;

let converting = false;


/*
===========================================================
 SUPPORTED EXTENSIONS
===========================================================
*/

const supportedExtensions = [

    "mp4",
    "mov",
    "m4v",
    "avi",
    "mkv",
    "webm",
    "wmv",
    "flv",
    "mpeg",
    "mpg",
    "3gp",
    "3g2",
    "ts",
    "mts",
    "m2ts",
    "ogv"

];


/*
===========================================================
 SELECT VIDEOS
===========================================================
*/

selectVideosBtn.addEventListener(
    "click",
    () => {

        videoInput.click();

    }
);


videoInput.addEventListener(
    "change",
    () => {

        addFiles(
            Array.from(
                videoInput.files || []
            )
        );

        videoInput.value = "";

    }
);


/*
===========================================================
 SELECT FOLDER
===========================================================
*/

selectFolderBtn.addEventListener(
    "click",
    () => {

        folderInput.click();

    }
);


folderInput.addEventListener(
    "change",
    () => {

        addFiles(
            Array.from(
                folderInput.files || []
            )
        );

        folderInput.value = "";

    }
);


/*
===========================================================
 ADD FILES
===========================================================
*/

function addFiles(files) {

    const videos =
        files.filter(
            isSupportedVideo
        );


    if (!videos.length) {

        showStatus(
            "No supported video files found.",
            "error"
        );

        return;

    }


    for (const file of videos) {

        const duplicate =
            selectedVideos.some(
                oldFile =>

                oldFile.name === file.name &&
                oldFile.size === file.size &&
                oldFile.lastModified ===
                    file.lastModified
            );


        if (!duplicate) {

            selectedVideos.push(
                file
            );

        }

    }


    updateSelection();

}


/*
===========================================================
 CHECK VIDEO
===========================================================
*/

function isSupportedVideo(file) {

    const name =
        file.name.toLowerCase();

    const extension =
        name.includes(".")
            ? name.split(".").pop()
            : "";


    if (
        file.type &&
        file.type.startsWith("video/")
    ) {

        return true;

    }


    return supportedExtensions.includes(
        extension
    );

}


/*
===========================================================
 UPDATE SELECTION
===========================================================
*/

function updateSelection() {

    selectionBox.style.display =
        "block";


    const total =
        selectedVideos.reduce(
            (sum, file) =>
                sum + file.size,
            0
        );


    selectionInfo.innerHTML =

        `<strong>
            ${selectedVideos.length}
        </strong> video(s) selected
        <br>
        Total size:
        <strong>
            ${formatBytes(total)}
        </strong>`;


    if (
        selectedVideos.length === 1
    ) {

        selectionInfo.innerHTML +=

            `<br>
            ${escapeHTML(
                selectedVideos[0].name
            )}`;

    }

}


/*
===========================================================
 CREATE SAME-ORIGIN COMPATIBLE FFmpeg WORKER
===========================================================

This solves:

Failed to construct 'Worker':
Script from CDN cannot be accessed from origin

The normal FFmpeg class worker imports:
    ./const.js
    ./errors.js

A Blob worker cannot resolve those relative imports
from the CDN, so we replace them with Blob URLs.
===========================================================
*/

async function createFFmpegClassWorker() {

    const workerURL =
        "https://cdn.jsdelivr.net/npm/@ffmpeg/ffmpeg@0.12.10/dist/esm/worker.js";

    const constURL =
        "https://cdn.jsdelivr.net/npm/@ffmpeg/ffmpeg@0.12.10/dist/esm/const.js";

    const errorsURL =
        "https://cdn.jsdelivr.net/npm/@ffmpeg/ffmpeg@0.12.10/dist/esm/errors.js";


    /*
       Download worker dependencies
    */

    const [
        workerResponse,
        constResponse,
        errorsResponse
    ] = await Promise.all([

        fetch(workerURL),

        fetch(constURL),

        fetch(errorsURL)

    ]);


    if (
        !workerResponse.ok ||
        !constResponse.ok ||
        !errorsResponse.ok
    ) {

        throw new Error(
            "Could not load FFmpeg worker files."
        );

    }


    let workerCode =
        await workerResponse.text();

    const constCode =
        await constResponse.text();

    const errorsCode =
        await errorsResponse.text();


    /*
       Create Blob URLs for dependencies
    */

    const constBlob =
        new Blob(
            [constCode],
            {
                type:
                    "text/javascript"
            }
        );


    const constBlobURL =
        URL.createObjectURL(
            constBlob
        );


    const errorsBlob =
        new Blob(
            [errorsCode],
            {
                type:
                    "text/javascript"
            }
        );


    const errorsBlobURL =
        URL.createObjectURL(
            errorsBlob
        );


    /*
       Replace relative imports
    */

    workerCode =
        workerCode.replace(
            /from\s+["']\.\/const\.js["']/g,
            `from "${constBlobURL}"`
        );


    workerCode =
        workerCode.replace(
            /from\s+["']\.\/errors\.js["']/g,
            `from "${errorsBlobURL}"`
        );


    /*
       Create worker Blob
    */

    const workerBlob =
        new Blob(
            [workerCode],
            {
                type:
                    "text/javascript"
            }
        );


    const workerBlobURL =
        URL.createObjectURL(
            workerBlob
        );


    return {
        url: workerBlobURL,

        dependencies: [
            constBlobURL,
            errorsBlobURL
        ]
    };

}


/*
===========================================================
 LOAD FFMPEG
===========================================================
*/

async function loadFFmpeg() {

    if (ffmpegLoaded) {

        return;

    }


    showLoading(
        "Loading FFmpeg..."
    );


    /*
       Create FFmpeg
    */

    ffmpeg =
        new FFmpeg();


    /*
       Progress listener
    */

    ffmpeg.on(
        "progress",
        ({
            progress
        }) => {

            const percent =
                Math.max(
                    0,
                    Math.min(
                        100,
                        Math.round(
                            progress * 100
                        )
                    )
                );


            progressBar.style.width =
                percent + "%";


            progressText.textContent =
                percent + "%";

        }
    );


    /*
       Log errors
    */

    ffmpeg.on(
        "log",
        ({
            message
        }) => {

            console.log(
                "[FFmpeg]",
                message
            );

        }
    );


    /*
       FFmpeg core
    */

    const baseURL =
        "https://cdn.jsdelivr.net/npm/@ffmpeg/core@0.12.10/dist/esm";


    /*
       IMPORTANT:
       Create a Blob-based class worker.

       This is the fix for your
       powertool.shopcom.in CORS error.
    */

    const worker =
        await createFFmpegClassWorker();


    /*
       Create Blob URLs for core
    */

    const coreURL =
        await toBlobURL(
            `${baseURL}/ffmpeg-core.js`,
            "text/javascript"
        );


    const wasmURL =
        await toBlobURL(
            `${baseURL}/ffmpeg-core.wasm`,
            "application/wasm"
        );


    /*
       Load FFmpeg
    */

    await ffmpeg.load({

        coreURL,

        wasmURL,

        classWorkerURL:
            worker.url

    });


    ffmpegLoaded =
        true;


    progressArea.style.display =
        "none";


    showStatus(
        "FFmpeg ready. You can start converting.",
        "success"
    );

}


/*
===========================================================
 LOAD STATUS
===========================================================
*/

function showLoading(message) {

    progressArea.style.display =
        "block";


    progressTitle.textContent =
        message;


    progressBar.style.width =
        "0%";


    progressText.textContent =
        "Please wait...";

}


/*
===========================================================
 GENERATE
===========================================================
*/

generateBtn.addEventListener(
    "click",
    async () => {

        if (converting) {

            return;

        }


        if (!selectedVideos.length) {

            showStatus(
                "Please select videos first.",
                "error"
            );

            return;

        }


        converting =
            true;


        convertedVideos =
            [];


        results.innerHTML =
            "";


        generateBtn.disabled =
            true;

        zipBtn.disabled =
            true;

        selectVideosBtn.disabled =
            true;

        selectFolderBtn.disabled =
            true;


        try {

            await loadFFmpeg();

            await convertAll();

        }
        catch (error) {

            console.error(
                error
            );


            showStatus(
                "Conversion failed: " +
                getErrorMessage(error),
                "error"
            );

        }


        converting =
            false;


        generateBtn.disabled =
            false;

        selectVideosBtn.disabled =
            false;

        selectFolderBtn.disabled =
            false;

    }
);


/*
===========================================================
 CONVERT ALL
===========================================================
*/

async function convertAll() {

    progressArea.style.display =
        "block";


    const total =
        selectedVideos.length;


    let successCount =
        0;


    for (
        let i = 0;
        i < total;
        i++
    ) {

        const file =
            selectedVideos[i];


        progressTitle.textContent =
            `Converting ${i + 1} of ${total}: ${file.name}`;


        progressBar.style.width =
            "0%";


        progressText.textContent =
            "Starting...";


        try {

            const converted =
                await convertVideo(
                    file
                );


            convertedVideos.push(
                converted
            );


            createCard(
                converted
            );


            successCount++;


        }
        catch (error) {

            console.error(
                "Conversion failed:",
                file.name,
                error
            );


            /*
               Continue with remaining files
            */

            showStatus(
                `Skipped: ${file.name}`,
                "error"
            );

        }

    }


    progressBar.style.width =
        "100%";


    progressText.textContent =
        "100%";


    progressTitle.textContent =
        "Conversion Complete";


    if (
        successCount > 0
    ) {

        zipBtn.disabled =
            false;


        showStatus(
            `${successCount} video(s) converted successfully.`,
            "success"
        );

    }
    else {

        showStatus(
            "No videos could be converted.",
            "error"
        );

    }


    setTimeout(
        () => {

            progressArea.style.display =
                "none";

        },
        1200
    );

}


/*
===========================================================
 CONVERT ONE VIDEO
===========================================================
*/

async function convertVideo(file) {

    /*
       Get original extension
    */

    const extension =
        getExtension(
            file.name
        );


    /*
       Create unique FFmpeg input filename
    */

    const inputName =
        "input_" +
        Date.now() +
        "_" +
        Math.random()
            .toString(36)
            .slice(2) +
        "." +
        extension;


    /*
       Output filename
    */

    const baseName =
        sanitizeFilename(
            removeExtension(
                file.name
            )
        );


    const prefix =
        sanitizeFilename(
            prefixInput.value.trim()
        );


    let finalName;


    if (prefix) {

        finalName =
            prefix +
            "_" +
            baseName +
            ".mp4";

    }
    else {

        finalName =
            baseName +
            ".mp4";

    }


    const outputName =
        "output_" +
        Date.now() +
        "_" +
        Math.random()
            .toString(36)
            .slice(2) +
        ".mp4";


    /*
       Write input
    */

    await ffmpeg.writeFile(
        inputName,
        await fetchFile(file)
    );


    /*
       FFmpeg arguments
    */

    const args = [

        "-i",
        inputName

    ];


    /*
       Video mapping

       Ignore unknown streams and use
       the first video/audio stream.
    */

    args.push(
        "-map",
        "0:v:0"
    );


    args.push(
        "-map",
        "0:a:0?"
    );


    /*
       RESOLUTION
    */

    const resolution =
        resolutionSelect.value;


    if (
        resolution !==
        "original"
    ) {

        const [
            width,
            height
        ] =
            resolution.split(":");


        /*
           Preserve aspect ratio.

           The output fits inside the selected
           resolution and is padded if needed.
        */

        args.push(
            "-vf",
            `scale=${width}:${height}:force_original_aspect_ratio=decrease,pad=${width}:${height}:(ow-iw)/2:(oh-ih)/2`
        );

    }


    /*
       FPS
    */

    const fps =
        fpsSelect.value;


    if (
        fps !==
        "original"
    ) {

        args.push(
            "-r",
            fps
        );

    }


    /*
       VIDEO CODEC

       H.264 is used because it provides
       broad MP4 compatibility.
    */

    args.push(
        "-c:v",
        "libx264"
    );


    /*
       Encoding speed
    */

    args.push(
        "-preset",
        "veryfast"
    );


    /*
       Bitrate
    */

    args.push(
        "-b:v",
        bitrateSelect.value
    );


    /*
       H.264 compatibility
    */

    args.push(
        "-pix_fmt",
        "yuv420p"
    );


    /*
       Audio

       Convert every input audio stream to AAC.
    */

    args.push(
        "-c:a",
        "aac"
    );


    args.push(
        "-b:a",
        "128k"
    );


    /*
       MP4 compatibility
    */

    args.push(
        "-movflags",
        "+faststart"
    );


    /*
       Prevent encoder failure on unusual
       timestamps
    */

    args.push(
        "-avoid_negative_ts",
        "make_zero"
    );


    /*
       Output
    */

    args.push(
        "-y",
        outputName
    );


    /*
       Execute
    */

    const exitCode =
        await ffmpeg.exec(
            args
        );


    if (
        exitCode !== 0
    ) {

        throw new Error(
            "FFmpeg could not encode this video."
        );

    }


    /*
       Read output
    */

    const data =
        await ffmpeg.readFile(
            outputName
        );


    /*
       Create Blob

       Copy into a normal ArrayBuffer so
       the Blob is safe across browsers.
    */

    const copy =
        new Uint8Array(
            data.length
        );


    copy.set(
        data
    );


    const blob =
        new Blob(
            [copy],
            {
                type:
                    "video/mp4"
            }
        );


    /*
       Cleanup
    */

    try {

        await ffmpeg.deleteFile(
            inputName
        );

    }
    catch (e) {}


    try {

        await ffmpeg.deleteFile(
            outputName
        );

    }
    catch (e) {}


    /*
       Preview URL
    */

    const url =
        URL.createObjectURL(
            blob
        );


    return {

        name:
            finalName,

        blob,

        url,

        size:
            blob.size,

        originalName:
            file.name

    };

}


/*
===========================================================
 CREATE RESULT CARD
===========================================================
*/

function createCard(video) {

    const card =
        document.createElement(
            "div"
        );


    card.className =
        "video-card";


    /*
       Video
    */

    const videoElement =
        document.createElement(
            "video"
        );


    videoElement.className =
        "video-preview";


    videoElement.src =
        video.url;


    videoElement.controls =
        true;


    videoElement.preload =
        "metadata";


    videoElement.playsInline =
        true;


    /*
       Name
    */

    const name =
        document.createElement(
            "div"
        );


    name.className =
        "video-name";


    name.textContent =
        video.name;


    name.title =
        video.name;


    /*
       Size
    */

    const info =
        document.createElement(
            "div"
        );


    info.className =
        "video-info";


    info.textContent =
        formatBytes(
            video.size
        );


    /*
       Download
    */

    const download =
        document.createElement(
            "button"
        );


    download.className =
        "download-btn";


    download.textContent =
        "Download";


    download.addEventListener(
        "click",
        () => {

            downloadBlob(
                video.blob,
                video.name
            );

        }
    );


    card.appendChild(
        videoElement
    );


    card.appendChild(
        name
    );


    card.appendChild(
        info
    );


    card.appendChild(
        download
    );


    results.appendChild(
        card
    );

}


/*
===========================================================
 ZIP DOWNLOAD
===========================================================
*/

zipBtn.addEventListener(
    "click",
    async () => {

        if (
            !convertedVideos.length
        ) {

            return;

        }


        zipBtn.disabled =
            true;

        generateBtn.disabled =
            true;

        selectVideosBtn.disabled =
            true;

        selectFolderBtn.disabled =
            true;


        progressArea.style.display =
            "block";


        progressTitle.textContent =
            "Creating ZIP file...";


        progressBar.style.width =
            "0%";


        progressText.textContent =
            "Preparing...";


        try {

            const zip =
                new JSZip();


            const folder =
                zip.folder(
                    "converted-videos"
                );


            const total =
                convertedVideos.length;


            for (
                let i = 0;
                i < total;
                i++
            ) {

                const video =
                    convertedVideos[i];


                folder.file(
                    video.name,
                    video.blob
                );


                const percent =
                    Math.round(
                        ((i + 1) /
                            total) *
                        40
                    );


                progressBar.style.width =
                    percent + "%";


                progressText.textContent =
                    percent + "%";

            }


            progressTitle.textContent =
                "Compressing ZIP...";


            const zipBlob =
                await zip.generateAsync(
                    {
                        type:
                            "blob",

                        compression:
                            "DEFLATE",

                        compressionOptions:
                        {
                            level:
                                3
                        }
                    },

                    metadata => {

                        const percent =
                            40 +
                            Math.round(
                                metadata.percent *
                                .60
                            );


                        progressBar.style.width =
                            percent + "%";


                        progressText.textContent =
                            percent + "%";

                    }
                );


            downloadBlob(
                zipBlob,
                "converted-videos.zip"
            );


            progressBar.style.width =
                "100%";


            progressText.textContent =
                "100%";


            progressTitle.textContent =
                "ZIP Ready";


            showStatus(
                "ZIP downloaded successfully.",
                "success"
            );


        }
        catch (error) {

            console.error(
                error
            );


            showStatus(
                "Could not create ZIP: " +
                getErrorMessage(error),
                "error"
            );

        }


        setTimeout(
            () => {

                progressArea.style.display =
                    "none";

            },
            1200
        );


        zipBtn.disabled =
            false;

        generateBtn.disabled =
            false;

        selectVideosBtn.disabled =
            false;

        selectFolderBtn.disabled =
            false;

    }
);


/*
===========================================================
 DOWNLOAD
===========================================================
*/

function downloadBlob(
    blob,
    filename
) {

    const url =
        URL.createObjectURL(
            blob
        );


    const a =
        document.createElement(
            "a"
        );


    a.href =
        url;


    a.download =
        filename;


    a.style.display =
        "none";


    document.body.appendChild(
        a
    );


    a.click();


    a.remove();


    setTimeout(
        () => {

            URL.revokeObjectURL(
                url
            );

        },
        5000
    );

}


/*
===========================================================
 STATUS
===========================================================
*/

function showStatus(
    message,
    type = ""
) {

    status.textContent =
        message;


    status.className =
        "status " +
        type;

}


/*
===========================================================
 EXTENSION
===========================================================
*/

function getExtension(
    filename
) {

    const parts =
        filename.split(".");


    if (
        parts.length <= 1
    ) {

        return "mp4";

    }


    return parts
        .pop()
        .toLowerCase();

}


/*
===========================================================
 REMOVE EXTENSION
===========================================================
*/

function removeExtension(
    filename
) {

    return filename.replace(
        /\.[^/.]+$/,
        ""
    );

}


/*
===========================================================
 SAFE FILENAME
===========================================================
*/

function sanitizeFilename(
    filename
) {

    return filename

        .replace(
            /[<>:"/\\|?*\x00-\x1F]/g,
            ""
        )

        .replace(
            /\s+/g,
            "_"
        )

        .replace(
            /_+/g,
            "_"
        )

        .replace(
            /^[_\.]+|[_\.]+$/g,
            ""
        )

        .substring(
            0,
            120
        );

}


/*
===========================================================
 BYTES
===========================================================
*/

function formatBytes(
    bytes
) {

    if (
        !bytes
    ) {

        return "0 Bytes";

    }


    const units = [
        "Bytes",
        "KB",
        "MB",
        "GB",
        "TB"
    ];


    const index =
        Math.floor(
            Math.log(bytes) /
            Math.log(1024)
        );


    return (
        parseFloat(
            (
                bytes /
                Math.pow(
                    1024,
                    index
                )
            ).toFixed(2)
        ) +
        " " +
        units[index]
    );

}


/*
===========================================================
 ESCAPE HTML
===========================================================
*/

function escapeHTML(
    text
) {

    const div =
        document.createElement(
            "div"
        );


    div.textContent =
        text;


    return div.innerHTML;

}


/*
===========================================================
 ERROR MESSAGE
===========================================================
*/

function getErrorMessage(
    error
) {

    if (
        error &&
        error.message
    ) {

        return error.message;

    }


    return String(
        error
    );

}
