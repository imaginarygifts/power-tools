        45px;

===================================================== */

    cursor: pointer;

        transparent;
}

.main-btn {

/* =====================================================

    border-radius: 0;

    padding:

}

===================================================== */

}

   SELECTION BOX
===================================================== */

    line-height: 1.5;

}


/* =====================================================
   PROGRESS AREA
===================================================== */

    background: white;

    border:
        1px solid #ddd;

    border-radius: 10px;

    padding: 20px;

    margin-top: 25px;
}

.progress-title {

    font-size: 20px;

    font-weight: bold;

    margin-bottom: 15px;

    word-break: break-word;
}

.progress-bar-bg {

    width: 100%;

    height: 22px;

    background: #ddd;

    border-radius: 20px;

    overflow: hidden;
}

.progress-bar {

    width: 0%;

    height: 100%;

    background: #4caf50;

    transition:
        width .15s linear;
}

.progress-text {

    text-align: center;

    font-size: 17px;

    color: #555;

    margin-top: 10px;
}


/* =====================================================
   STATUS
===================================================== */

.status {

    text-align: center;

    font-size: 18px;

    margin-top: 20px;

    min-height: 26px;

    line-height: 1.4;
}

.status.success {

    color: #2e7d32;
}

.status.error {

}

   RESULTS
===================================================== */

.results {

    display: grid;

    grid-template-columns:
        repeat(3, minmax(0, 1fr));

    gap: 18px;

    margin-top: 38px;
}

.video-card {

    min-width: 0;
}

.video-preview {

    width: 100%;

    aspect-ratio: 1 / 1;

    object-fit: cover;

    display: block;

    background: #ddd;

    border-radius: 10px;
}

    color: #333;

}

===================================================== */

        3px solid

        spin .8s linear infinite;

<script type="module">


import {

    FFmpeg

}
from
"https://cdn.jsdelivr.net/npm/@ffmpeg/ffmpeg@0.12.10/dist/esm/index.js";


import {

    fetchFile,

    toBlobURL

}
from
"https://cdn.jsdelivr.net/npm/@ffmpeg/util@0.12.1/dist/esm/index.js";



/* =====================================================
   ELEMENTS
===================================================== */

const selectVideosBtn =
    document.getElementById(
        "selectVideosBtn"
    );


const selectFolderBtn =
    document.getElementById(
        "selectFolderBtn"
    );


const videoInput =
    document.getElementById(
        "videoInput"
    );


const folderInput =
    document.getElementById(
        "folderInput"
    );


const resolutionSelect =
    document.getElementById(
        "resolutionSelect"
    );


const bitrateSelect =
    document.getElementById(
        "bitrateSelect"
    );


const fpsSelect =
    document.getElementById(
        "fpsSelect"
    );


const prefixInput =
    document.getElementById(
        "prefixInput"
    );


const generateBtn =
    document.getElementById(
        "generateBtn"
    );


const zipBtn =
    document.getElementById(
        "zipBtn"
    );


const selectionBox =
    document.getElementById(
        "selectionBox"
    );


const selectionInfo =
    document.getElementById(
        "selectionInfo"
    );


const progressArea =
    document.getElementById(
        "progressArea"
    );


const progressTitle =
    document.getElementById(
        "progressTitle"
    );


const progressBar =
    document.getElementById(
        "progressBar"
    );


const progressText =
    document.getElementById(
        "progressText"
    );


const status =
    document.getElementById(
        "status"
    );


const results =
    document.getElementById(
        "results"
    );



/* =====================================================
   VARIABLES
===================================================== */

let selectedVideos = [];

let convertedVideos = [];

let ffmpeg = null;

let ffmpegLoaded = false;

let converting = false;


/* =====================================================
   SUPPORTED VIDEO TYPES
===================================================== */

const supportedExtensions = [

    "mp4",
    "mov",
    "m4v",
    "avi",
    "mkv",
    "webm",
    "wmv",
    "flv",
    "mpeg",
    "mpg",
    "3gp",
    "3g2",
    "ts",
    "mts",
    "m2ts",
    "ogv"

];



/* =====================================================
   SELECT VIDEOS
===================================================== */

selectVideosBtn.addEventListener(
    "click",
    () => {

        videoInput.click();

    }
);


videoInput.addEventListener(
    "change",
    () => {

        addFiles(
            Array.from(
                videoInput.files || []
            )
        );

        videoInput.value = "";

    }
);



/* =====================================================
   SELECT FOLDER
===================================================== */

selectFolderBtn.addEventListener(
    "click",
    () => {

        folderInput.click();

    }
);


folderInput.addEventListener(
    "change",
    () => {

        addFiles(
            Array.from(
                folderInput.files || []
            )
        );

        folderInput.value = "";

    }
);



/* =====================================================
   ADD FILES
===================================================== */

function addFiles(files) {

    const videos =
        files.filter(
            isSupportedVideo
        );


    if (!videos.length) {

        showStatus(
            "No supported video files found.",
            "error"
        );

        return;

    }


    for (
        const file of videos
    ) {

        const duplicate =
            selectedVideos.some(
                oldFile =>

                    oldFile.name ===
                        file.name &&

                    oldFile.size ===
                        file.size &&

                    oldFile.lastModified ===
                        file.lastModified
            );


        if (!duplicate) {

            selectedVideos.push(
                file
            );

        }

    }


    updateSelection();

}



/* =====================================================
   VIDEO CHECK
===================================================== */

function isSupportedVideo(file) {

    const name =
        file.name.toLowerCase();


    const extension =
        name.includes(".")
            ? name.split(".").pop()
            : "";


    if (
        file.type &&
        file.type.startsWith("video/")
    ) {

        return true;

    }


    return supportedExtensions.includes(
        extension
    );

}



/* =====================================================
   UPDATE SELECTION
===================================================== */

function updateSelection() {

    selectionBox.style.display =
        "block";


    const total =
        selectedVideos.reduce(
            (
                sum,
                file
            ) =>
                sum + file.size,
            0
        );


    selectionInfo.innerHTML =

        `<strong>
            ${selectedVideos.length}
        </strong>
        video(s) selected
        <br>
        Total size:
        <strong>
            ${formatBytes(total)}
        </strong>`;


    if (
        selectedVideos.length === 1
    ) {

        selectionInfo.innerHTML +=

            `<br>
            ${escapeHTML(
                selectedVideos[0].name
            )}`;

    }

}



/* =====================================================
   CREATE FFMPEG CLASS WORKER
===================================================== */

async function createFFmpegClassWorker() {

    const workerURL =
        "https://cdn.jsdelivr.net/npm/@ffmpeg/ffmpeg@0.12.10/dist/esm/worker.js";


    const constURL =
        "https://cdn.jsdelivr.net/npm/@ffmpeg/ffmpeg@0.12.10/dist/esm/const.js";


    const errorsURL =
        "https://cdn.jsdelivr.net/npm/@ffmpeg/ffmpeg@0.12.10/dist/esm/errors.js";


    const [

        workerResponse,

        constResponse,

        errorsResponse

    ] = await Promise.all([

        fetch(workerURL),

        fetch(constURL),

        fetch(errorsURL)

    ]);


    if (

        !workerResponse.ok ||

        !constResponse.ok ||

        !errorsResponse.ok

    ) {

        throw new Error(
            "Could not load FFmpeg worker files."
        );

    }


    let workerCode =
        await workerResponse.text();


    const constCode =
        await constResponse.text();


    const errorsCode =
        await errorsResponse.text();


    const constBlob =
        new Blob(
            [constCode],
            {
                type:
                    "text/javascript"
            }
        );


    const constBlobURL =
        URL.createObjectURL(
            constBlob
        );


    const errorsBlob =
        new Blob(
            [errorsCode],
            {
                type:
                    "text/javascript"
            }
        );


    const errorsBlobURL =
        URL.createObjectURL(
            errorsBlob
        );


    workerCode =
        workerCode.replace(
            /from\s+["']\.\/const\.js["']/g,
            `from "${constBlobURL}"`
        );


    workerCode =
        workerCode.replace(
            /from\s+["']\.\/errors\.js["']/g,
            `from "${errorsBlobURL}"`
        );


    const workerBlob =
        new Blob(
            [workerCode],
            {
                type:
                    "text/javascript"
            }
        );


    const workerBlobURL =
        URL.createObjectURL(
            workerBlob
        );


    return {

        url:
            workerBlobURL,

        dependencies: [

            constBlobURL,

            errorsBlobURL

        ]

    };

}



/* =====================================================
   LOAD FFMPEG
===================================================== */

async function loadFFmpeg() {

    if (ffmpegLoaded) {

        return;

    }


    showLoading(
        "Loading FFmpeg..."
    );


    ffmpeg =
        new FFmpeg();


    ffmpeg.on(
        "progress",
        ({
            progress
        }) => {

            const percent =
                Math.max(
                    0,
                    Math.min(
                        100,
                        Math.round(
                            progress * 100
                        )
                    )
                );


            progressBar.style.width =
                percent + "%";


            progressText.textContent =
                percent + "%";

        }
    );


    ffmpeg.on(
        "log",
        ({
            message
        }) => {

            console.log(
                "[FFmpeg]",
                message
            );

        }
    );


    const baseURL =
        "https://cdn.jsdelivr.net/npm/@ffmpeg/core@0.12.10/dist/esm";


    const worker =
        await createFFmpegClassWorker();


    const coreURL =
        await toBlobURL(
            `${baseURL}/ffmpeg-core.js`,
            "text/javascript"
        );


    const wasmURL =
        await toBlobURL(
            `${baseURL}/ffmpeg-core.wasm`,
            "application/wasm"
        );


    await ffmpeg.load({

        coreURL,

        wasmURL,

        classWorkerURL:
            worker.url

    });


    ffmpegLoaded =
        true;


    progressArea.style.display =
        "none";


    showStatus(
        "FFmpeg ready.",
        "success"
    );

}



/* =====================================================
   LOADING UI
===================================================== */

function showLoading(message) {

    progressArea.style.display =
        "block";


    progressTitle.textContent =
        message;


    progressBar.style.width =
        "0%";


    progressText.textContent =
        "Please wait...";

}



/* =====================================================
   GET VIDEO DIMENSIONS
=====================================================

   This is the important part.

   We inspect the actual video dimensions BEFORE
   conversion.

   Examples:

   Landscape:
       1920 × 1080
       3840 × 2160

   Portrait:
       1080 × 1920
       2160 × 3840

   Square:
       1080 × 1080

   The selected resolution will then automatically
   follow that orientation.
===================================================== */

async function getVideoDimensions(file) {

    return new Promise(
        (resolve, reject) => {

            const video =
                document.createElement(
                    "video"
                );


            const objectURL =
                URL.createObjectURL(
                    file
                );


            let finished =
                false;


            function cleanup() {

                URL.revokeObjectURL(
                    objectURL
                );


                video.removeAttribute(
                    "src"
                );


                video.load();

            }


            function success() {

                if (finished) {

                    return;

                }


                finished = true;


                const width =
                    video.videoWidth;


                const height =
                    video.videoHeight;


                cleanup();


                if (
                    width > 0 &&
                    height > 0
                ) {

                    resolve({

                        width,

                        height

                    });

                }
                else {

                    reject(
                        new Error(
                            "Could not read video dimensions."
                        )
                    );

                }

            }


            function failure() {

                if (finished) {

                    return;

                }


                finished = true;


                cleanup();


                reject(
                    new Error(
                        "Could not detect video orientation."
                    )
                );

            }


            video.preload =
                "metadata";


            video.muted =
                true;


            video.playsInline =
                true;


            video.onloadedmetadata =
                success;


            video.onerror =
                failure;


            video.src =
                objectURL;

        }
    );

}



/* =====================================================
   CALCULATE OUTPUT DIMENSIONS
=====================================================

   IMPORTANT:

   We DO NOT force everything to 1920 × 1080.

   Instead:

   Landscape video:
       max 1920 wide
       proportional height

   Portrait video:
       max 1920 high
       proportional width

   Square:
       max 1920 × 1920

   This preserves the original aspect ratio.
===================================================== */

function calculateOutputSize(
    sourceWidth,
    sourceHeight,
    maxDimension
) {


    if (
        !maxDimension ||
        maxDimension === "original"
    ) {

        return {

            width:
                sourceWidth,

            height:
                sourceHeight

        };

    }


    const max =
        Number(
            maxDimension
        );


    if (
        !Number.isFinite(max) ||
        max <= 0
    ) {

        return {

            width:
                sourceWidth,

            height:
                sourceHeight

        };

    }


    /*
       Landscape
    */

    if (
        sourceWidth >
        sourceHeight
    ) {

        const scale =
            Math.min(
                1,
                max / sourceWidth
            );


        return {

            width:
                makeEven(
                    sourceWidth *
                    scale
                ),

            height:
                makeEven(
                    sourceHeight *
                    scale
                )

        };

    }


    /*
       Portrait
    */

    if (
        sourceHeight >
        sourceWidth
    ) {

        const scale =
            Math.min(
                1,
                max / sourceHeight
            );


        return {

            width:
                makeEven(
                    sourceWidth *
                    scale
                ),

            height:
                makeEven(
                    sourceHeight *
                    scale
                )

        };

    }


    /*
       Square
    */

    const scale =
        Math.min(
            1,
            max / sourceWidth
        );


    return {

        width:
            makeEven(
                sourceWidth *
                scale
            ),

        height:
            makeEven(
                sourceHeight *
                scale
            )

    };

}



/* =====================================================
   EVEN DIMENSION
===================================================== */

function makeEven(value) {

    let number =
        Math.round(
            Number(value)
        );


    if (
        number < 2
    ) {

        number = 2;

    }


    if (
        number % 2 !== 0
    ) {

        number -= 1;

    }


    return number;

}



/* =====================================================
   GENERATE / RESIZE
===================================================== */

generateBtn.addEventListener(
    "click",
    async () => {


        if (converting) {

            return;

        }


        if (
            !selectedVideos.length
        ) {

            showStatus(
                "Please select videos first.",
                "error"
            );

            return;

        }


        converting =
            true;


        convertedVideos =
            [];


        results.innerHTML =
            "";


        generateBtn.disabled =
            true;


        zipBtn.disabled =
            true;


        selectVideosBtn.disabled =
            true;


        selectFolderBtn.disabled =
            true;


        try {

            await loadFFmpeg();


            await convertAll();

        }
        catch (error) {

            console.error(
                error
            );


            showStatus(
                "Conversion failed: " +
                getErrorMessage(error),
                "error"
            );

        }


        converting =
            false;


        generateBtn.disabled =
            false;


        selectVideosBtn.disabled =
            false;


        selectFolderBtn.disabled =
            false;

    }
);



/* =====================================================
   CONVERT ALL
===================================================== */

async function convertAll() {

    progressArea.style.display =
        "block";


    const total =
        selectedVideos.length;


    let successCount =
        0;


    for (
        let i = 0;
        i < total;
        i++
    ) {


        const file =
            selectedVideos[i];


        progressTitle.textContent =
            `Detecting orientation ${i + 1} of ${total}: ${file.name}`;


        progressBar.style.width =
            "0%";


        progressText.textContent =
            "Reading video...";


        try {


            const converted =
                await convertVideo(
                    file
                );


            convertedVideos.push(
                converted
            );


            createCard(
                converted
            );


            successCount++;


        }
        catch (error) {


            console.error(
                "Conversion failed:",
                file.name,
                error
            );


            showStatus(
                `Skipped: ${file.name}`,
                "error"
            );

        }

    }


    progressBar.style.width =
        "100%";


    progressText.textContent =
        "100%";


    progressTitle.textContent =
        "Conversion Complete";


    if (
        successCount > 0
    ) {


        zipBtn.disabled =
            false;


        showStatus(
            `${successCount} video(s) converted successfully.`,
            "success"
        );

    }
    else {


        showStatus(
            "No videos could be converted.",
            "error"
        );

    }


    setTimeout(
        () => {

            progressArea.style.display =
                "none";

        },
        1200
    );

}



/* =====================================================
   CONVERT ONE VIDEO
===================================================== */

async function convertVideo(file) {


    /*
       First detect actual video orientation.
    */

    const dimensions =
        await getVideoDimensions(
            file
        );


    const sourceWidth =
        dimensions.width;


    const sourceHeight =
        dimensions.height;


    /*
       Calculate output dimensions.

       Example:

       Source:
           1080 × 1920

       Full HD max:
           1920

       Output:
           1080 × 1920

       Source:
           1920 × 1080

       Full HD max:
           1920

       Output:
           1920 × 1080
    */

    const outputSize =
        calculateOutputSize(
            sourceWidth,
            sourceHeight,
            resolutionSelect.value
        );


    console.log(
        "Video:",
        file.name
    );


    console.log(
        "Source:",
        sourceWidth,
        "x",
        sourceHeight
    );


    console.log(
        "Output:",
        outputSize.width,
        "x",
        outputSize.height
    );


    /*
       Show orientation in progress
    */

    const orientation =
        sourceWidth === sourceHeight
            ? "Square"
            : sourceWidth > sourceHeight
                ? "Landscape"
                : "Portrait";


    progressTitle.textContent =
        `Converting ${file.name} • ${orientation} • ${outputSize.width}×${outputSize.height}`;


    /*
       Input extension
    */

    const extension =
        getExtension(
            file.name
        );


    /*
       Unique FFmpeg input
    */

    const inputName =
        "input_" +
        Date.now() +
        "_" +
        Math.random()
            .toString(36)
            .slice(2) +
        "." +
        extension;


    /*
       Base filename
    */

    const baseName =
        sanitizeFilename(
            removeExtension(
                file.name
            )
        );


    /*
       Prefix
    */

    const prefix =
        sanitizeFilename(
            prefixInput.value.trim()
        );


    let finalName;


    if (prefix) {

        finalName =
            prefix +
            "_" +
            baseName +
            ".mp4";

    }
    else {

        finalName =
            baseName +
            ".mp4";

    }


    /*
       FFmpeg output
    */

    const outputName =
        "output_" +
        Date.now() +
        "_" +
        Math.random()
            .toString(36)
            .slice(2) +
        ".mp4";


    /*
       Write input
    */

    await ffmpeg.writeFile(
        inputName,
        await fetchFile(file)
    );


    /*
       FFmpeg arguments
    */

    const args = [

        "-i",
        inputName

    ];


    /*
       Video stream
    */

    args.push(
        "-map",
        "0:v:0"
    );


    /*
       Audio stream if present
    */

    args.push(
        "-map",
        "0:a:0?"
    );


    /*
       =================================================
       ORIENTATION-PRESERVING SCALE
       =================================================

       We do NOT use:

       scale=1920:1080
       pad=1920:1080

       because that forces every video into landscape.

       Instead we directly scale to the calculated
       proportional dimensions.
    */

    const selectedResolution =
        resolutionSelect.value;


    if (
        selectedResolution !==
        "original"
    ) {


        /*
           Only resize when source is larger
           than selected maximum.

           Smaller videos are NOT enlarged.
        */

        if (

            outputSize.width !==
                sourceWidth ||

            outputSize.height !==
                sourceHeight

        ) {


            args.push(

                "-vf",

                `scale=${outputSize.width}:${outputSize.height}:flags=lanczos`

            );

        }

    }


    /*
       FPS
    */

    const fps =
        fpsSelect.value;


    if (
        fps !== "original"
    ) {

        args.push(
            "-r",
            fps
        );

    }


    /*
       H.264
    */

    args.push(

        "-c:v",
        "libx264",

        "-preset",
        "veryfast",

        "-b:v",
        bitrateSelect.value,

        "-pix_fmt",
        "yuv420p"

    );


    /*
       AAC audio
    */

    args.push(

        "-c:a",
        "aac",

        "-b:a",
        "128k"

    );


    /*
       MP4 compatibility
    */

    args.push(

        "-movflags",
        "+faststart"

    );


    /*
       Timestamp handling
    */

    args.push(

        "-avoid_negative_ts",
        "make_zero"

    );


    /*
       Output
    */

    args.push(

        "-y",
        outputName

    );


    /*
       Execute
    */

    const exitCode =
        await ffmpeg.exec(
            args
        );


    if (
        exitCode !== 0
    ) {

        throw new Error(
            "FFmpeg could not encode this video."
        );

    }


    /*
       Read output
    */

    const data =
        await ffmpeg.readFile(
            outputName
        );


    /*
       Safe copy
    */

    const copy =
        new Uint8Array(
            data.length
        );


    copy.set(
        data
    );


    /*
       MP4 Blob
    */

    const blob =
        new Blob(
            [copy],
            {
                type:
                    "video/mp4"
            }
        );


    /*
       Cleanup
    */

    try {

        await ffmpeg.deleteFile(
            inputName
        );

    }
    catch (e) {}


    try {

        await ffmpeg.deleteFile(
            outputName
        );

    }
    catch (e) {}


    /*
       Preview URL
    */

    const url =
        URL.createObjectURL(
            blob
        );


    return {

        name:
            finalName,

        blob,

        url,

        size:
            blob.size,

        originalName:
            file.name,

        width:
            outputSize.width,

        height:
            outputSize.height

    };

}



/* =====================================================
   CREATE VIDEO CARD
===================================================== */

function createCard(video) {


    const card =
        document.createElement(
            "div"
        );


    card.className =
        "video-card";


    /*
       Video
    */

    const videoElement =
        document.createElement(
            "video"
        );


    videoElement.className =
        "video-preview";


    videoElement.src =
        video.url;


    videoElement.controls =
        true;


    videoElement.preload =
        "metadata";


    videoElement.playsInline =
        true;


    /*
       Filename
    */

    const name =
        document.createElement(
            "div"
        );


    name.className =
        "video-name";


    name.textContent =
        video.name;


    name.title =
        video.name;


    /*
       Info
    */

    const info =
        document.createElement(
            "div"
        );


    info.className =
        "video-info";


    info.textContent =
        `${video.width}×${video.height} • ${formatBytes(video.size)}`;


    /*
       Download button
    */

    const download =
        document.createElement(
            "button"
        );


    download.className =
        "download-btn";


    download.textContent =
        "Download";


    download.addEventListener(
        "click",
        () => {

            downloadBlob(
                video.blob,
                video.name
            );

        }
    );


    /*
       Append
    */

    card.appendChild(
        videoElement
    );


    card.appendChild(
        name
    );


    card.appendChild(
        info
    );


    card.appendChild(
        download
    );


    results.appendChild(
        card
    );

}



/* =====================================================
   DOWNLOAD ZIP
===================================================== */

zipBtn.addEventListener(
    "click",
    async () => {


        if (
            !convertedVideos.length
        ) {

            return;

        }


        zipBtn.disabled =
            true;


        generateBtn.disabled =
            true;


        selectVideosBtn.disabled =
            true;


        selectFolderBtn.disabled =
            true;


        progressArea.style.display =
            "block";


        progressTitle.textContent =
            "Creating ZIP file...";


        progressBar.style.width =
            "0%";


        progressText.textContent =
            "Preparing...";


        try {


            const zip =
                new JSZip();


            const folder =
                zip.folder(
                    "converted-videos"
                );


            const total =
                convertedVideos.length;


            /*
               Add files
            */

            for (
                let i = 0;
                i < total;
                i++
            ) {


                const video =
                    convertedVideos[i];


                folder.file(
                    video.name,
                    video.blob
                );


                const percent =
                    Math.round(
                        (
                            (i + 1) /
                            total
                        ) *
                        40
                    );


                progressBar.style.width =
                    percent + "%";


                progressText.textContent =
                    percent + "%";

            }


            progressTitle.textContent =
                "Compressing ZIP...";


            /*
               Generate ZIP
            */

            const zipBlob =
                await zip.generateAsync(

                    {

                        type:
                            "blob",

                        compression:
                            "DEFLATE",

                        compressionOptions:
                        {

                            level:
                                3

                        }

                    },

                    metadata => {


                        const percent =
                            40 +
                            Math.round(
                                metadata.percent *
                                .60
                            );


                        progressBar.style.width =
                            percent + "%";


                        progressText.textContent =
                            percent + "%";

                    }

                );


            /*
               Download
            */

            downloadBlob(
                zipBlob,
                "converted-videos.zip"
            );


            progressBar.style.width =
                "100%";


            progressText.textContent =
                "100%";


            progressTitle.textContent =
                "ZIP Ready";


            showStatus(
                "ZIP downloaded successfully.",
                "success"
            );


        }
        catch (error) {


            console.error(
                error
            );


            showStatus(
                "Could not create ZIP: " +
                getErrorMessage(error),
                "error"
            );

        }


        setTimeout(
            () => {

                progressArea.style.display =
                    "none";

            },
            1200
        );


        zipBtn.disabled =
            false;


        generateBtn.disabled =
            false;


        selectVideosBtn.disabled =
            false;


        selectFolderBtn.disabled =
            false;

    }
);



/* =====================================================
   DOWNLOAD HELPER
===================================================== */

function downloadBlob(
    blob,
    filename
) {


    const url =
        URL.createObjectURL(
            blob
        );


    const a =
        document.createElement(
            "a"
        );


    a.href =
        url;


    a.download =
        filename;


    a.style.display =
        "none";


    document.body.appendChild(
        a
    );


    a.click();


    a.remove();


    setTimeout(
        () => {

            URL.revokeObjectURL(
                url
            );

        },
        5000
    );

}



/* =====================================================
   STATUS
===================================================== */

function showStatus(
    message,
    type = ""
) {


    status.textContent =
        message;


    status.className =
        "status " +
        type;

}



/* =====================================================
   FILE EXTENSION
===================================================== */

function getExtension(
    filename
) {


    const parts =
        filename.split(".");


    if (
        parts.length <= 1
    ) {

        return "mp4";

    }


    return parts
        .pop()
        .toLowerCase();

}



/* =====================================================
   REMOVE EXTENSION
===================================================== */

function removeExtension(
    filename
) {

    return filename.replace(
        /\.[^/.]+$/,
        ""
    );

}



/* =====================================================
   SANITIZE FILENAME
===================================================== */

function sanitizeFilename(
    filename
) {


    return filename

        .replace(
            /[<>:"/\\|?*\x00-\x1F]/g,
            ""
        )

        .replace(
            /\s+/g,
            "_"
        )

        .replace(
            /_+/g,
            "_"
        )

        .replace(
            /^[_\.]+|[_\.]+$/g,
            ""
        )

        .substring(
            0,
            120
        );

}



/* =====================================================
   FORMAT BYTES
===================================================== */

function formatBytes(
    bytes
) {


    if (
        !bytes
    ) {

        return "0 Bytes";

    }


    const units = [

        "Bytes",
        "KB",
        "MB",
        "GB",
        "TB"

    ];


    const index =
        Math.floor(
            Math.log(bytes) /
            Math.log(1024)
        );


    return (

        parseFloat(

            (
                bytes /
                Math.pow(
                    1024,
                    index
                )
            ).toFixed(2)

        )

        +

        " " +

        units[index]

    );

}



/* =====================================================
   ESCAPE HTML
===================================================== */

function escapeHTML(
    text
) {


    const div =
        document.createElement(
            "div"
        );


    div.textContent =
        text;


    return div.innerHTML;

}



/* =====================================================
   ERROR MESSAGE
===================================================== */

function getErrorMessage(
    error
) {


    if (
        error &&
        error.message
    ) {

        return error.message;

    }


    return String(
        error
    );

}



/* =====================================================
   INITIAL STATUS
===================================================== */

showStatus(
    "Select videos to begin."
);
